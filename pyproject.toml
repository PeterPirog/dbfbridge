[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbfbridge"
version = "0.1.0.dev0"
description = "Bidirectional DBF (Visual FoxPro) <-> CSV/JSON/JSONL/XLSX converter with Polish encoding fallback (Mazovia/cp852/cp1250)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Peter Pirog", email = "pirog.peter@gmail.com" },
]
keywords = ["dbf", "foxpro", "visual foxpro", "csv", "json", "jsonl", "xlsx", "mazovia", "polish", "converter", "migration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: File Formats",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "dbfread>=2.0.7",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1.5"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "build>=1.2",
    "twine>=5.1",
]

[project.scripts]
dbf-bridge = "dbf_bridge.cli:main"
dbf-bridge-verify = "dbf_bridge.verifier:main"

[project.urls]
Homepage = "https://github.com/PeterPirog/dbfbridge"
Repository = "https://github.com/PeterPirog/dbfbridge"
Issues = "https://github.com/PeterPirog/dbfbridge/issues"
Changelog = "https://github.com/PeterPirog/dbfbridge/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dbf_bridge = ["py.typed"]