[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbfbridge"
version = "0.2.0"
description = "Visual FoxPro DBF migration, reconstruction, and quality verification toolkit."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Peter Pirog", email = "pirog.peter@gmail.com" },
]
keywords = ["dbf", "foxpro", "visual foxpro", "csv", "json", "jsonl", "xlsx", "mazovia", "polish", "converter", "migration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: File Formats",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "dbfread>=2.0.7",
]

[project.optional-dependencies]
# DBF/FPT reconstruction (`reconstruct_dbf`, `check_conversion_quality`) is
# written with the `dbf` writer.  Missing [write] fails typed
# (OPTIONAL_DEPENDENCY_MISSING) BEFORE any output is created.
write = ["dbf>=0.99.11"]
# XLSX export needs xlsxwriter; XLSX input reading for reconstruction needs
# openpyxl.  XLSX -> DBF reconstruction requires BOTH extras:
#   pip install "dbfbridge[write,xlsx]"
xlsx = ["xlsxwriter>=3.2", "openpyxl>=3.1.5"]
# Pure accelerators.  Missing [fast] NEVER fails: JSON uses the stdlib
# fallback and CSV uses the Python streaming engine - the logical result is
# identical, only the engine differs.
fast = ["orjson>=3.10", "polars>=1.0"]
# Full user-facing feature set: Direct Read + migration + reconstruction +
# XLSX + accelerators.  Not a development environment (no pytest/ruff/build).
all = [
    "dbf>=0.99.11",
    "openpyxl>=3.1.5",
    "orjson>=3.10",
    "polars>=1.0",
    "xlsxwriter>=3.2",
]
# Historical compatibility alias: [import] used to stand for the
# reconstruction dependencies (installed by default before 0.3); it now
# resolves to the same set as [write].
import = ["dbf>=0.99.11"]
# Benchmark-only: RSS/IO counters for the Phase 0 benchmark runner.  NOT a
# runtime dependency of dbfbridge; required only for a versioned --baseline.
benchmark = ["psutil>=5.9"]
# Full contributor/test environment: every runtime capability dependency the
# complete test suite exercises (dbf, openpyxl, xlsxwriter, orjson, polars)
# plus lint/build/publish tooling.  Written out explicitly — never a
# self-referential extra.  NOT a user-facing install profile.
dev = [
    "dbf>=0.99.11",
    "openpyxl>=3.1.5",
    "orjson>=3.10",
    "polars>=1.0",
    "psutil>=5.9",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "build>=1.2",
    "twine>=5.1",
    "ruff>=0.6",
    "tomli>=2.0; python_version < '3.11'",
    "xlsxwriter>=3.2",
]

[project.scripts]
dbf-bridge = "dbf_bridge.cli:main"
dbf-bridge-import = "dbf_bridge.import_cli:main"
dbf-bridge-quality = "dbf_bridge.quality:main"
dbf-bridge-verify = "dbf_bridge.verifier:main"

[project.urls]
Homepage = "https://github.com/PeterPirog/dbfbridge"
Repository = "https://github.com/PeterPirog/dbfbridge"
Source = "https://github.com/PeterPirog/dbfbridge"
Documentation = "https://github.com/PeterPirog/dbfbridge/blob/main/docs/pypi-usage.md"
Issues = "https://github.com/PeterPirog/dbfbridge/issues"
Changelog = "https://github.com/PeterPirog/dbfbridge/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dbf_bridge = ["py.typed"]
dbfbridge = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in argument defaults (argparse patterns)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"examples/**" = ["E402"]

[tool.ruff.format]
docstring-code-format = true
