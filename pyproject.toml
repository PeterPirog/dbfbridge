[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbfbridge"
version = "0.1.0"
description = "Visual FoxPro DBF migration, reconstruction, and quality verification toolkit."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Peter Pirog", email = "pirog.peter@gmail.com" },
]
keywords = ["dbf", "foxpro", "visual foxpro", "csv", "json", "jsonl", "xlsx", "mazovia", "polish", "converter", "migration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: File Formats",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "dbfread>=2.0.7",
    "dbf>=0.99.11",
    "openpyxl>=3.1.5",
    "orjson>=3.10",
    "polars>=1.0",
    "xlsxwriter>=3.2",
]

[project.optional-dependencies]
# Kept as a backwards-compatible no-op; DBF reconstruction is installed by default.
import = []
# Kept as a backwards-compatible no-op; XLSX support is installed by default.
xlsx = []
dev = [
    "dbf>=0.99.11",
    "openpyxl>=3.1.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "build>=1.2",
    "twine>=5.1",
    "ruff>=0.6",
]

[project.scripts]
dbf-bridge = "dbf_bridge.cli:main"
dbf-bridge-import = "dbf_bridge.import_cli:main"
dbf-bridge-quality = "dbf_bridge.quality:main"
dbf-bridge-verify = "dbf_bridge.verifier:main"

[project.urls]
Homepage = "https://github.com/PeterPirog/dbfbridge"
Repository = "https://github.com/PeterPirog/dbfbridge"
Issues = "https://github.com/PeterPirog/dbfbridge/issues"
Changelog = "https://github.com/PeterPirog/dbfbridge/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dbf_bridge = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in argument defaults (argparse patterns)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"examples/**" = ["E402"]

[tool.ruff.format]
docstring-code-format = true
