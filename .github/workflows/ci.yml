name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests benchmarks examples

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  package:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install build twine "dbf>=0.99.11"
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Fresh-wheel smoke (reusable helper)
        run: |
          wheel=$(find dist -maxdepth 1 -name 'dbfbridge-*.whl' -print -quit)
          python scripts/release_wheel_smoke.py --wheel "$wheel" --expected-version "0.2.0"
      - name: PyPI install-profile smoke (reusable helper)
        run: |
          wheel=$(find dist -maxdepth 1 -name 'dbfbridge-*.whl' -print -quit)
          python scripts/pypi_install_smoke.py --wheel "$wheel" --expected-version "0.2.0"
