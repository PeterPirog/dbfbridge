name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests benchmarks examples

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  package:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify wheel contents and imports
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -name 'dbfbridge-*.whl' -print -quit)
          python -m pip install --force-reinstall "$wheel"
          python -c "from dbfbridge import export_dbf, inspect_table, read_schema, iter_records, read_records, iter_raw_records, TableInfo, TableSchema, FieldInfo, DirectRecord, RecordPage, LazyMemoValue; from dbf_bridge import reconstruct_dbf"
          dbf-bridge --help >/dev/null
          dbf-bridge-import --help >/dev/null
          dbf-bridge-verify --help >/dev/null
          dbf-bridge-quality --help >/dev/null
