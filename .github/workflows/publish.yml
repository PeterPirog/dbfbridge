name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Verify release tag matches package version
        shell: bash
        run: |
          package_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$GITHUB_REF_NAME" = "v$package_version"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests benchmarks examples
      - run: python -m pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify built distribution metadata (version, py.typed, typing classifier)
        shell: bash
        run: |
          python - <<'PY'
          import email.parser, tomllib, zipfile
          from pathlib import Path

          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          wheels = sorted(Path("dist").glob("dbfbridge-*.whl"))
          assert len(wheels) == 1, f"expected exactly one wheel, found {wheels}"
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              metadata_path = next(
                  name for name in names if name.endswith(".dist-info/METADATA")
              )
              metadata = email.parser.BytesParser().parsebytes(archive.read(metadata_path))
          assert metadata["Version"] == version, (metadata["Version"], version)
          assert "Typing :: Typed" in metadata.get_all("Classifier", []), metadata.get_all("Classifier")
          for typed_marker in ("dbf_bridge/py.typed", "dbfbridge/py.typed"):
              assert typed_marker in names, f"{typed_marker} missing from the wheel"
          print(f"wheel metadata OK: version={metadata['Version']}, py.typed present, Typing :: Typed")
          PY
      - name: Fresh-wheel smoke (reusable helper)
        run: |
          wheel=$(find dist -maxdepth 1 -name 'dbfbridge-*.whl' -print -quit)
          python scripts/release_wheel_smoke.py --wheel "$wheel"
      - name: PyPI install-profile smoke (reusable helper)
        run: |
          wheel=$(find dist -maxdepth 1 -name 'dbfbridge-*.whl' -print -quit)
          python scripts/pypi_install_smoke.py --wheel "$wheel"
      - name: Store release distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish release to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dbfbridge
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
