name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Verify release tag matches package version
        shell: bash
        run: |
          package_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Release final-state gate (rejects release-preparation state)
        shell: bash
        run: python scripts/check_release_state.py --tag "$GITHUB_REF_NAME"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests benchmarks examples
      - run: python -m pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify built distributions (shared artifact verifier)
        shell: bash
        run: python scripts/verify_release_artifacts.py --dist dist
      - name: Fresh-wheel smoke (reusable helper)
        run: |
          wheel=$(find dist -maxdepth 1 -name 'dbfbridge-*.whl' -print -quit)
          python scripts/release_wheel_smoke.py --wheel "$wheel"
      - name: PyPI install-profile smoke (reusable helper)
        run: |
          wheel=$(find dist -maxdepth 1 -name 'dbfbridge-*.whl' -print -quit)
          python scripts/pypi_install_smoke.py --wheel "$wheel"
      - name: Store release distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish release to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dbfbridge
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
