name: Phase 3 benchmark

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: "Measured repetitions per scenario (>= 3 for a canonical run)"
        required: false
        default: "3"
      warmup:
        description: "Warm-up runs per scenario (>= 1 for a canonical run)"
        required: false
        default: "1"
      timeout:
        description: "Per-scenario worker timeout in seconds"
        required: false
        default: "900"
      canonical:
        description: "Publish into benchmarks/baselines/ (versioned trio, never overwrite)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  phase3-benchmark:
    name: Phase 3 canonical BEFORE (windows, 3.12)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project with benchmark extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show runner provenance
        run: |
          python -c "import platform, psutil; print(platform.platform(), platform.python_version(), psutil.virtual_memory().total)"

      - name: Run the Phase 3 profile
        shell: bash
        run: |
          args=(--profile phase3
                --warmup "${{ github.event.inputs.warmup || '1' }}"
                --repetitions "${{ github.event.inputs.repetitions || '3' }}"
                --timeout "${{ github.event.inputs.timeout || '900' }}"
                --storage-label "github-actions-windows-runner-temp")
          if [ "${{ github.event.inputs.canonical || 'false' }}" = "true" ]; then
            args+=(--baseline)
          fi
          python -m benchmarks.run_benchmark "${args[@]}"

      - name: Upload run reports
        uses: actions/upload-artifact@v4
        with:
          name: phase3-benchmark-reports
          path: |
            benchmarks/results/phase-3-performance-*.json
            benchmarks/results/phase-3-performance-*.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload the published baseline trio
        if: ${{ github.event.inputs.canonical == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase3-baseline-trio
          path: |
            benchmarks/baselines/phase-3-performance-full.json
            benchmarks/baselines/phase-3-performance-full.md
            benchmarks/baselines/phase-3-performance-full.manifest.json
          if-no-files-found: error
          retention-days: 14