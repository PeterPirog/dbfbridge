name: Phase 0 full baseline (temporary)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-baseline:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v6
        with:
          ref: 542961981e0062cdc977d1b7a4eec721e1f16fd4
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify clean source and process metrics
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne "542961981e0062cdc977d1b7a4eec721e1f16fd4") {
            throw "Unexpected checkout SHA"
          }
          if (git status --porcelain) {
            git status --short
            throw "Worktree is dirty before Phase 0 baseline"
          }
          python -c "import json, platform, psutil; p=psutil.Process(); print(json.dumps({'python': platform.python_version(), 'platform': platform.platform(), 'machine': platform.machine(), 'psutil': psutil.__version__, 'rss': p.memory_info().rss, 'io': p.io_counters()._asdict()}, indent=2))"

      - name: Test, lint, and package before benchmark
        shell: pwsh
        run: |
          python -m pytest tests/ -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/test_benchmark_infrastructure.py -q -rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check src tests benchmarks examples
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff format --check benchmarks tests/test_benchmark_infrastructure.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m twine check dist/*
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full profile and record baseline
        shell: pwsh
        run: |
          python -m benchmarks.run_benchmark --profile full --warmup 1 --repetitions 3 --timeout 7200 --baseline 2>&1 | Tee-Object -FilePath phase0-full-run.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify generated baseline
        shell: pwsh
        run: |
          python -c "import json, pathlib; from benchmarks.run_benchmark import check_baseline_gate; fs=list(pathlib.Path('benchmarks/baselines').glob('phase-0-full.json')); assert len(fs)==1, fs; p=json.loads(fs[0].read_text(encoding='utf-8')); r=check_baseline_gate(p); assert not r, r; ss=p['scenarios']; assert sum(s['status']=='MEASURED' for s in ss)==20; assert sum(s['status']=='NOT_IMPLEMENTED' for s in ss)==4; assert not any(s['status']=='FAILED' for s in ss); assert all(len(s['warmup_samples'])==1 and len(s['samples'])==3 and s['aggregated']['valid_baseline'] is True for s in ss if s['status']=='MEASURED'); assert all(x['peak_rss_bytes'] is not None and x['temporary_files_left']==0 and x['temporary_bytes_left']==0 for s in ss if s['status']=='MEASURED' for x in s['samples']); m=next(s for s in ss if s['scenario']=='reconstruction_memo_190k'); assert all(x['output_dbf_bytes']>0 and x['output_fpt_bytes']>0 and x['fpt_mib_per_second']>0 and x['temporary_publish_count']>=2 for x in m['samples']); print(json.dumps({'file':str(fs[0]),'commit':p['environment']['git']['commit'],'dirty':p['environment']['git']['dirty'],'measured':20,'not_implemented':4,'failed':0,'gate':'PASS'},indent=2))" | Tee-Object -FilePath phase0-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $partials = Get-ChildItem benchmark-data,benchmarks -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -split '\.' -contains 'partial' }
          if ($partials) {
            $partials | Format-Table FullName, Length
            throw "Temporary .partial artifacts remain"
          }

      - name: Upload baseline and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-0-full-baseline-windows-5429619
          if-no-files-found: warn
          retention-days: 14
          path: |
            benchmarks/baselines/phase-0-full.json
            benchmarks/baselines/phase-0-full.md
            benchmarks/results/phase-0-full.json
            benchmarks/results/phase-0-full.md
            phase0-full-run.log
            phase0-verification.json
            benchmark-data/logs/**
